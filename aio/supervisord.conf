[unix_http_server]
file=/var/run/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/workadventure

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ──────────────────────────────────────────────────────────────────────────────
; Core services — each runs as 'node' user for security
; Add new services by dropping a .conf file into /etc/supervisor/conf.d/
; ──────────────────────────────────────────────────────────────────────────────

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:play]
command=node --import tsx ./src/server.ts
directory=/usr/src/play
user=node
environment=TSX_TSCONFIG_PATH="tsconfig-pusher.json",NODE_ENV="production"
autostart=true
autorestart=true
priority=20
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:back]
command=node --import tsx src/server.ts
directory=/usr/src/back
user=node
environment=NODE_ENV="production"
autostart=true
autorestart=true
priority=20
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:map-storage]
command=node --import tsx ./src/index.ts
directory=/usr/src/map-storage
user=node
environment=ESBK_TSCONFIG_PATH="tsconfig-node.json",NODE_ENV="production"
autostart=true
autorestart=true
priority=20
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:uploader]
command=node --import tsx ./server.ts
directory=/usr/src/uploader
user=node
environment=NODE_ENV="production"
autostart=true
autorestart=true
priority=20
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ──────────────────────────────────────────────────────────────────────────────
; Include drop-in configs for additional services
; ──────────────────────────────────────────────────────────────────────────────
[include]
files = /etc/supervisor/conf.d/*.conf
