worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $request_uri" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    # Disable server tokens for security
    server_tokens off;

    # ── Upstream definitions ────────────────────────────────────────────────
    upstream play_http {
        server 127.0.0.1:3200;
    }
    upstream play_ws {
        server 127.0.0.1:3201;
    }
    upstream back_http {
        server 127.0.0.1:8180;
    }
    upstream map_storage_http {
        server 127.0.0.1:3000;
    }
    upstream uploader_http {
        server 127.0.0.1:8080;
    }

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Main server ─────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        # ── WebSocket endpoint (must be before catch-all) ───────────────────
        location /ws/ {
            proxy_pass http://play_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Map-storage API & UI ────────────────────────────────────────────
        location /map-storage/ {
            rewrite ^/map-storage/(.*) /$1 break;
            proxy_pass http://map_storage_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # ── Uploader ───────────────────────────────────────────────────────
        location /uploader/ {
            rewrite ^/uploader/(.*) /$1 break;
            proxy_pass http://uploader_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Back API (internal, but exposed for health checks / admin) ──────
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://back_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Default: play (frontend + pusher) ──────────────────────────────
        location / {
            proxy_pass http://play_http;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
