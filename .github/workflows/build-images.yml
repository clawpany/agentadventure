name: Build and push images

on:
  push:
    branches: [agent]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-play:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push play image
        id: build-play
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: play/Dockerfile
          push: true
          build-args: |
            FAST_BUILD=true
          tags: |
            ghcr.io/clawpany/agentadventure-play:latest
            ghcr.io/clawpany/agentadventure-play:agent
            ghcr.io/clawpany/agentadventure-play:${{ github.sha }}

      - name: Report play image size
        run: |
          IMAGE="ghcr.io/clawpany/agentadventure-play:${{ github.sha }}"
          RAW=$(skopeo inspect --raw docker://$IMAGE)
          MEDIA_TYPE=$(echo "$RAW" | jq -r '.mediaType // ""')
          if echo "$MEDIA_TYPE" | grep -qE 'index|list'; then
            DIGEST=$(echo "$RAW" | jq -r '[.manifests[] | select(.platform.architecture=="amd64" and .platform.os=="linux")] | .[0].digest')
            SIZE_BYTES=$(skopeo inspect --raw docker://ghcr.io/clawpany/agentadventure-play@${DIGEST} | jq '[.layers[].size] | add // 0')
          else
            SIZE_BYTES=$(echo "$RAW" | jq '[.layers[].size] | add // 0')
          fi
          SIZE_MB=$(echo "$SIZE_BYTES" | awk '{printf "%.2f", $1/1024/1024}')
          echo "### 📦 play 镜像构建信息" >> $GITHUB_STEP_SUMMARY
          echo "- **镜像名称**: \`$IMAGE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`${{ steps.build-play.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **远端压缩大小**: **${SIZE_MB} MB**" >> $GITHUB_STEP_SUMMARY

  build-aio:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push aio image
        id: build-aio
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: aio/Dockerfile
          push: true
          build-args: |
            FAST_BUILD=true
          tags: |
            ghcr.io/clawpany/agentadventure-aio:latest
            ghcr.io/clawpany/agentadventure-aio:agent
            ghcr.io/clawpany/agentadventure-aio:${{ github.sha }}

      - name: Report aio image size
        run: |
          IMAGE="ghcr.io/clawpany/agentadventure-aio:${{ github.sha }}"
          RAW=$(skopeo inspect --raw docker://$IMAGE)
          MEDIA_TYPE=$(echo "$RAW" | jq -r '.mediaType // ""')
          if echo "$MEDIA_TYPE" | grep -qE 'index|list'; then
            DIGEST=$(echo "$RAW" | jq -r '[.manifests[] | select(.platform.architecture=="amd64" and .platform.os=="linux")] | .[0].digest')
            SIZE_BYTES=$(skopeo inspect --raw docker://ghcr.io/clawpany/agentadventure-aio@${DIGEST} | jq '[.layers[].size] | add // 0')
          else
            SIZE_BYTES=$(echo "$RAW" | jq '[.layers[].size] | add // 0')
          fi
          SIZE_MB=$(echo "$SIZE_BYTES" | awk '{printf "%.2f", $1/1024/1024}')
          echo "### 📦 aio 镜像构建信息" >> $GITHUB_STEP_SUMMARY
          echo "- **镜像名称**: \`$IMAGE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`${{ steps.build-aio.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **远端压缩大小**: **${SIZE_MB} MB**" >> $GITHUB_STEP_SUMMARY
