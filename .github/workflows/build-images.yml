name: Build and push images

on:
  push:
    branches: [agent]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-play:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push play image
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: play/Dockerfile
          push: true
          build-args: |
            FAST_BUILD=true
          tags: |
            ghcr.io/clawpany/agentadventure-play:latest
            ghcr.io/clawpany/agentadventure-play:agent
            ghcr.io/clawpany/agentadventure-play:${{ github.sha }}

  build-aio:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push aio image
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: aio/Dockerfile
          push: true
          build-args: |
            FAST_BUILD=true
          tags: |
            ghcr.io/clawpany/agentadventure-aio:latest
            ghcr.io/clawpany/agentadventure-aio:agent
            ghcr.io/clawpany/agentadventure-aio:${{ github.sha }}
